<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Error Screen if Database Rules/Connection Fails -->
    <div id="server-error" class="hidden fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center text-center p-6">
        <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-2xl flex items-center justify-center text-2xl font-bold mb-4 border border-red-500/20">503</div>
        <h1 class="text-xl font-bold text-white mb-2">Cloud Database Disconnected</h1>
        <p class="text-sm text-slate-400 max-w-sm">Failed to connect to Firebase. Make sure Firestore is created in test mode in your Firebase Console.</p>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-800">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">N</div>
                <span class="font-bold text-lg tracking-tight">Nexus <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">Cloud Live</span></span>
            </div>
            <div id="server-status" class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                Connected to Nexus Cloud
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

        <!-- Create Post -->
        <div class="glass-panel rounded-2xl p-4 shadow-xl">
            <div class="flex gap-3">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" class="w-10 h-10 rounded-full border border-slate-700 object-cover">
                <div class="flex-1 space-y-3">
                    <textarea id="post-input" rows="3" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 resize-none" placeholder="What's on your mind?"></textarea>
                    <div class="flex justify-between items-center">
                        <input id="image-url-input" type="text" placeholder="Optional image URL..." class="bg-slate-900/60 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 w-2/3 focus:outline-none focus:border-indigo-500">
                        <button onclick="createPost()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs px-5 py-2 rounded-lg transition-all shadow-lg shadow-indigo-600/20">Post</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Feed Container -->
        <div id="feed-container" class="space-y-6"></div>

    </main>

    <!-- Firebase Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD5mThRVyds-E3AA_h4F9LxerCFTonSsF8",
            authDomain: "nexus-social-a7aeb.firebaseapp.com",
            projectId: "nexus-social-a7aeb",
            storageBucket: "nexus-social-a7aeb.firebasestorage.app",
            messagingSenderId: "606655999797",
            appId: "1:606655999797:web:a351d8df6d7196a025267c",
            measurementId: "G-VW6WH3QR1T"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            document.getElementById('server-error').classList.remove('hidden');
        }

        const CURRENT_USER = {
            name: "Jane Doe",
            handle: "janedoe",
            avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150"
        };

        // 1. Listen for posts in real-time
        const postsRef = collection(db, "posts");
        const postsQuery = query(postsRef, orderBy("createdAt", "desc"));

        onSnapshot(postsQuery, (snapshot) => {
            const posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderFeed(posts);
        }, (err) => {
            console.error(err);
            document.getElementById('server-error').classList.remove('hidden');
        });

        // 2. Create post
        window.createPost = async function() {
            const text = document.getElementById('post-input').value.trim();
            const imageUrl = document.getElementById('image-url-input').value.trim();
            if (!text) return;

            try {
                await addDoc(collection(db, "posts"), {
                    content: text,
                    image: imageUrl || null,
                    user: CURRENT_USER,
                    createdAt: serverTimestamp()
                });
                document.getElementById('post-input').value = '';
                document.getElementById('image-url-input').value = '';
            } catch (err) {
                alert("Failed to save post to cloud.");
            }
        };

        // 3. Listen for comments
        function listenToComments(postId) {
            const commentsRef = collection(db, "posts", postId, "comments");
            const commentsQuery = query(commentsRef, orderBy("createdAt", "desc"));

            onSnapshot(commentsQuery, (snapshot) => {
                const comments = snapshot.docs.map(doc => doc.data());
                const container = document.getElementById(`comments-list-${postId}`);
                if (!container) return;

                container.innerHTML = comments.map(c => `
                    <div class="bg-slate-900/40 rounded-xl p-2.5 border border-slate-800/50 flex gap-2.5">
                        <img src="${c.user.avatar}" class="w-6 h-6 rounded-full object-cover border border-slate-700">
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <span class="font-medium text-xs text-slate-200">${c.user.name}</span>
                                <span class="text-[10px] text-slate-500">Just now</span>
                            </div>
                            <p class="text-xs text-slate-300 mt-0.5">${c.text}</p>
                        </div>
                    </div>
                `).join('');
            });
        }

        // 4. Add comment
        window.addComment = async function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            try {
                await addDoc(collection(db, "posts", postId, "comments"), {
                    text: text,
                    user: CURRENT_USER,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (err) {
                alert("Failed to save comment.");
            }
        };

        // 5. Render feed
        function renderFeed(posts) {
            const feedEl = document.getElementById('feed-container');
            feedEl.innerHTML = '';

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'glass-panel rounded-2xl p-5 space-y-4 shadow-xl border border-slate-800';
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${post.user.avatar}" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                        <div>
                            <div class="font-semibold text-sm text-slate-100">${post.user.name}</div>
                            <div class="text-xs text-slate-400">@${post.user.handle}</div>
                        </div>
                    </div>

                    <p class="text-sm text-slate-200 leading-relaxed">${post.content}</p>
                    ${post.image ? `<img src="${post.image}" class="rounded-xl w-full max-h-96 object-cover border border-slate-800">` : ''}

                    <div class="pt-3 border-t border-slate-800/80 space-y-3">
                        <div class="flex gap-2">
                            <input id="comment-input-${post.id}" type="text" placeholder="Write a comment..." class="flex-1 bg-slate-900/80 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <button onclick="addComment('${post.id}')" class="bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg transition-colors">Comment</button>
                        </div>
                        <div id="comments-list-${post.id}" class="space-y-2"></div>
                    </div>
                `;

                feedEl.appendChild(card);
                listenToComments(post.id);
            });
        }
    </script>
</body>
</html>
